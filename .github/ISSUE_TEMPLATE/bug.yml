name: Bug report
description: Report a reproducible problem in HatsuTech.
title: "fix: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Current behavior
      description: What happens now?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the commands, inputs or bot events needed to reproduce.
      placeholder: |
        1. Run `/...`
        2. Click `...`
        3. Observe `...`
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add logs, screenshots or Discord message links. Do not include secrets.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Mention server, channel type, command, branch, host or other relevant context.
    validations:
      required: false

