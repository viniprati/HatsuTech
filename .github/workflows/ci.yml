name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate YAML syntax
        run: |
          ruby -e 'require "yaml"; Dir[".github/**/*.{yml,yaml}"].each { |file| YAML.load_file(file); puts "valid #{file}" }'

      - name: Compile Python files
        run: |
          python -m compileall -q main.py config.py database.py utils.py version.py cogs scripts tests

      - name: Start local MongoDB replica set
        run: |
          docker run --detach --name hatsutech-test-mongo \
            --publish 127.0.0.1:27019:27019 \
            mongo:8.0 --replSet hatsutech-test --port 27019 --bind_ip_all
          python - <<'PY'
          import time
          from pymongo import MongoClient
          from pymongo.errors import PyMongoError

          direct = MongoClient(host="127.0.0.1", port=27019, directConnection=True, serverSelectionTimeoutMS=1000)
          for attempt in range(30):
              try:
                  direct.admin.command("ping")
                  break
              except PyMongoError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          direct.admin.command("replSetInitiate", {
              "_id": "hatsutech-test", "members": [{"_id": 0, "host": "127.0.0.1:27019"}],
          })
          direct.close()
          replica = MongoClient(host="127.0.0.1", port=27019, replicaSet="hatsutech-test", serverSelectionTimeoutMS=30000)
          replica.admin.command("ping")
          replica.close()
          PY

      - name: Run unit tests for bot behavior and MongoDB integration tests for finance
        env:
          HATSUTECH_TEST_MONGO_PORT: "27019"
        run: |
          python -m unittest discover -s tests -v

      - name: Validate static bot contracts
        run: |
          python scripts/validate_static_contracts.py

      - name: Check installed dependencies
        run: |
          python -m pip check
